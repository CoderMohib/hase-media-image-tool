<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story & Post Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Anton&family=Libre+Franklin:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=Bricolage+Grotesque:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#151412;
    --panel:#1d1c19;
    --panel-2:#262420;
    --line:#37342e;
    --paper:#f3efe4;
    --accent:#c9a227;
    --muted:#9a968a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Libre Franklin', sans-serif;
    min-height:100vh;
  }
  .app{ display:flex; min-height:100vh; }
  .controls{
    width:420px;
    flex:0 0 420px;
    background:var(--panel);
    padding:28px 26px 60px;
    overflow-y:auto;
    max-height:100vh;
    border-right:1px solid var(--line);
  }
  .stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
    position:relative;
  }
  .brand h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:20px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  .sub{ color:var(--muted); font-size:13px; margin:0 0 24px; line-height:1.5; }
  .group{
    margin-bottom:22px;
    padding-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .group:last-of-type{ border-bottom:none; }
  .group h2{
    font-family:'Space Grotesk', sans-serif;
    font-size:12px;
    font-weight:500;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--accent);
    margin:0 0 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .group h2 button{
    text-transform:none;
    letter-spacing:0;
    font-size:11px;
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:5px;
    padding:3px 8px;
    cursor:pointer;
    font-family:'Libre Franklin', sans-serif;
  }
  .group h2 button:hover{ color:var(--paper); border-color:var(--accent); }
  label{ display:block; font-size:12px; color:var(--muted); margin:0 0 6px; }
  .field{ margin-bottom:14px; }
  input[type="text"], textarea, select{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--paper);
    border-radius:6px;
    padding:9px 11px;
    font-family:'Libre Franklin', sans-serif;
    font-size:13.5px;
    resize:vertical;
  }
  textarea{ min-height:56px; line-height:1.4; }
  input[type="text"]:focus, textarea:focus, select:focus{ outline:none; border-color:var(--accent); }
  .row{ display:flex; gap:10px; }
  .row > *{ flex:1; }
  .color-row{ display:flex; align-items:center; gap:8px; }
  .color-row input[type="color"]{
    width:38px; height:34px; padding:0; border:1px solid var(--line);
    border-radius:6px; background:none; cursor:pointer; flex:0 0 auto;
  }
  .color-row input[type="text"]{
    font-family:'Space Grotesk', monospace; text-transform:uppercase; letter-spacing:0.02em;
  }
  .presets{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .preset-swatch{
    width:22px; height:22px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.25); cursor:pointer; padding:0;
  }
  .upload-slot{
    display:flex; align-items:center; gap:10px; margin-bottom:8px;
    background:var(--panel-2); border:1px dashed var(--line); border-radius:8px; padding:10px;
  }
  .upload-slot .thumb{
    width:44px; height:44px; border-radius:5px; background:#000 center/cover no-repeat;
    flex:0 0 auto; border:1px solid var(--line);
  }
  .upload-slot .info{ flex:1; font-size:12.5px; color:var(--muted); }
  .upload-slot .info b{ color:var(--paper); font-weight:500; display:block; font-size:12.5px; }
  .upload-slot input[type="file"]{ display:none; }
  .btn-tiny{
    background:none; border:1px solid var(--line); color:var(--paper);
    border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer;
    font-family:'Libre Franklin', sans-serif; flex:0 0 auto;
  }
  .btn-tiny:hover{ border-color:var(--accent); color:var(--accent); }
  .slot-adjust{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px 12px;
    margin-bottom:14px;
  }
  .slot-adjust .slot-title{
    font-size:12px;
    color:var(--paper);
    font-weight:500;
    margin-bottom:8px;
  }
  .slider-row{
    display:grid;
    grid-template-columns:70px 1fr 40px;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .slider-row label{ margin:0; font-size:11.5px; color:var(--muted); }
  .slider-row span{ font-size:11.5px; color:var(--muted); text-align:right; }
  input[type="range"]{
    width:100%;
    accent-color:var(--accent);
  }
  .layout-choices{ display:flex; gap:8px; }
  .layout-choices button{
    flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    border-radius:6px; padding:9px 6px; font-size:12px; cursor:pointer;
    font-family:'Libre Franklin', sans-serif;
  }
  .layout-choices button.active{ border-color:var(--accent); color:var(--paper); background:rgba(201,162,39,0.12); }
  .size-choices{ display:flex; gap:8px; }
  .size-choices button{
    flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    border-radius:6px; padding:9px 4px; font-size:11.5px; cursor:pointer;
    font-family:'Libre Franklin', sans-serif; line-height:1.3;
  }
  .size-choices button.active{ border-color:var(--accent); color:var(--paper); background:rgba(201,162,39,0.12); }
  select{ appearance:none; -webkit-appearance:none; }
  .canvas-wrap{
    position:relative; box-shadow:0 20px 60px rgba(0,0,0,0.5);
    border-radius:6px; overflow:hidden; background:#000;
  }
  canvas{ display:block; max-height:88vh; max-width:100%; height:auto; width:auto; }
  .download-bar{ position:sticky; bottom:0; background:var(--panel); margin-top:8px; padding-top:4px; }
  .btn-main{
    width:100%; background:var(--accent); color:#221708; border:none;
    border-radius:8px; padding:13px 14px; font-size:14px; font-weight:700;
    cursor:pointer; font-family:'Space Grotesk', sans-serif; letter-spacing:0.01em;
  }
  .btn-main:hover{ filter:brightness(1.08); }
  .zoom-hint{
    position:absolute; top:14px; right:14px; font-size:11px; color:rgba(255,255,255,0.55);
    background:rgba(0,0,0,0.4); padding:4px 9px; border-radius:20px;
  }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
</style>
</head>
<body>

<div class="app">
  <div class="controls">
    <div class="brand"><h1>Story &amp; Post Maker</h1></div>
    <p class="sub">Upload photos, write your text, size and position everything, then download at the right dimensions.</p>

    <div class="group">
      <h2>Canvas size</h2>
      <div class="size-choices">
        <button data-size="story" class="active">Story / Reel<br>1080 × 1920</button>
        <button data-size="portrait">Feed portrait<br>1080 × 1350</button>
        <button data-size="square">Feed square<br>1080 × 1080</button>
      </div>
    </div>

    <div class="group">
      <h2>Photos<button id="resetImgBtn">Reset positions</button></h2>
      <div class="layout-choices">
        <button data-layout="single" class="active">1 photo</button>
        <button data-layout="triptych">3 photos</button>
      </div>
      <div id="uploadSlots" style="margin-top:14px;"></div>

      <div class="slot-adjust">
        <div class="slot-title">Image block position</div>
        <div class="slider-row">
          <label>Top</label>
          <input type="range" id="imgTop" min="0" max="1920" step="2">
          <span id="imgTopVal"></span>
        </div>
        <div class="slider-row">
          <label>Height</label>
          <input type="range" id="imgHeight" min="60" max="1400" step="2">
          <span id="imgHeightVal"></span>
        </div>
      </div>

      <div id="slotAdjustments"></div>
    </div>

    <div class="group">
      <h2>Top bar text</h2>
      <div class="row">
        <div class="field">
          <label>Top left</label>
          <input type="text" id="topLeft" value="SS'26 EDT-2">
        </div>
        <div class="field">
          <label>Top right</label>
          <input type="text" id="topRight" value="LIVE NOW">
        </div>
      </div>
      <div class="slider-row">
        <label>Text size</label>
        <input type="range" id="topFontSize" min="12" max="60" step="1">
        <span id="topFontSizeVal"></span>
      </div>
    </div>

    <div class="group">
      <h2>Headline</h2>
      <div class="field">
        <label>Big title</label>
        <textarea id="headline">New Add-Ons</textarea>
      </div>
      <div class="slider-row">
        <label>Text size</label>
        <input type="range" id="headlineFontSize" min="30" max="220" step="2">
        <span id="headlineFontSizeVal"></span>
      </div>
      <div class="field" style="margin-top:10px;">
        <label>Lines under title (one per line)</label>
        <textarea id="subhead">LT1K Contrast
Tape Slim Tank
Top</textarea>
      </div>
      <div class="slider-row">
        <label>Text size</label>
        <input type="range" id="subheadFontSize" min="14" max="70" step="1">
        <span id="subheadFontSizeVal"></span>
      </div>
      <div class="field" style="margin-top:10px;">
        <label>Headline font</label>
        <select id="headlineFont">
          <option value="Archivo Black">Archivo Black — heavy grotesk</option>
          <option value="Anton" selected>Anton — tall condensed</option>
          <option value="Bricolage Grotesque">Bricolage Grotesque — bold rounded</option>
          <option value="Space Grotesk">Space Grotesk — modern mono-grotesk</option>
        </select>
      </div>
    </div>

    <div class="group">
      <h2>Bottom block</h2>
      <div class="field">
        <label>Small label</label>
        <input type="text" id="bottomLabel" value="SS'26 EDT-2">
      </div>
      <div class="slider-row">
        <label>Text size</label>
        <input type="range" id="bottomLabelFontSize" min="12" max="60" step="1">
        <span id="bottomLabelFontSizeVal"></span>
      </div>
      <div class="field" style="margin-top:10px;">
        <label>Bottom heading</label>
        <input type="text" id="bottomHeading" value="Reconsidered for season">
      </div>
      <div class="slider-row">
        <label>Text size</label>
        <input type="range" id="bottomHeadingFontSize" min="20" max="110" step="1">
        <span id="bottomHeadingFontSizeVal"></span>
      </div>
      <div class="field" style="margin-top:10px;">
        <label>Description</label>
        <textarea id="bottomDesc">Essentials in effortless fits and everyday favourites made for your rotation and plans.</textarea>
      </div>
      <div class="slider-row">
        <label>Text size</label>
        <input type="range" id="descFontSize" min="12" max="60" step="1">
        <span id="descFontSizeVal"></span>
      </div>
      <div class="field" style="margin-top:10px;">
        <label>Body font</label>
        <select id="bodyFont">
          <option value="Libre Franklin" selected>Libre Franklin</option>
          <option value="DM Sans">DM Sans</option>
          <option value="Space Grotesk">Space Grotesk</option>
        </select>
      </div>
    </div>

    <div class="group">
      <h2>Colors (hex)</h2>
      <div class="field">
        <label>Background</label>
        <div class="color-row">
          <input type="color" id="colorBgPicker" value="#faf6ec">
          <input type="text" id="colorBg" value="#FAF6EC">
        </div>
      </div>
      <div class="field">
        <label>Headline color</label>
        <div class="color-row">
          <input type="color" id="colorHeadlinePicker" value="#2b2013">
          <input type="text" id="colorHeadline" value="#2B2013">
        </div>
      </div>
      <div class="field">
        <label>Top bar / labels color</label>
        <div class="color-row">
          <input type="color" id="colorLabelPicker" value="#8b6b1f">
          <input type="text" id="colorLabel" value="#8B6B1F">
        </div>
      </div>
      <div class="field">
        <label>Bottom heading color</label>
        <div class="color-row">
          <input type="color" id="colorBottomHeadPicker" value="#2b2013">
          <input type="text" id="colorBottomHead" value="#2B2013">
        </div>
      </div>
      <div class="field">
        <label>Description text color</label>
        <div class="color-row">
          <input type="color" id="colorDescPicker" value="#5c4a32">
          <input type="text" id="colorDesc" value="#5C4A32">
        </div>
      </div>
      <div class="presets" id="palettePresets"></div>
    </div>

    <div class="download-bar">
      <button class="btn-main" id="downloadBtn">Download PNG</button>
    </div>
  </div>

  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="canvas" width="1080" height="1920"></canvas>
      <div class="zoom-hint" id="dimsLabel">1080 × 1920</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const SIZES = {
  story:   {w:1080, h:1920},
  portrait:{w:1080, h:1350},
  square:  {w:1080, h:1080}
};

let currentSize = 'story';
let currentLayout = 'single';
let images = { single: null, left: null, center: null, right: null };

let imgAdjust = {
  single: {zoom:1, panX:0, panY:0},
  left:   {zoom:1, panX:0, panY:0},
  center: {zoom:1, panX:0, panY:0},
  right:  {zoom:1, panX:0, panY:0}
};

let layout = {};

function defaultLayoutFor(size){
  const {w,h} = SIZES[size];
  return {
    topFontSize: Math.round(h*0.017),
    headlineFontSize: Math.round(h*0.062),
    subheadFontSize: Math.round(h*0.021),
    bottomLabelFontSize: Math.round(h*0.019),
    bottomHeadingFontSize: Math.round(h*0.028),
    descFontSize: Math.round(h*0.0175),
    imgTop: Math.round(h*0.36),
    imgHeight: Math.round(h*(size==='square'?0.42:0.38))
  };
}

function resetLayoutDefaults(){
  layout = defaultLayoutFor(currentSize);
  syncSlidersFromLayout();
}

function syncSlidersFromLayout(){
  const {h} = SIZES[currentSize];
  setSlider('topFontSize', layout.topFontSize, 8, Math.round(h*0.05));
  setSlider('headlineFontSize', layout.headlineFontSize, 8, Math.round(h*0.16));
  setSlider('subheadFontSize', layout.subheadFontSize, 8, Math.round(h*0.06));
  setSlider('bottomLabelFontSize', layout.bottomLabelFontSize, 8, Math.round(h*0.05));
  setSlider('bottomHeadingFontSize', layout.bottomHeadingFontSize, 8, Math.round(h*0.09));
  setSlider('descFontSize', layout.descFontSize, 8, Math.round(h*0.05));
  setSlider('imgTop', layout.imgTop, 0, h, h);
  setSlider('imgHeight', layout.imgHeight, 40, h, h);
}

function setSlider(id, value, minOverride, maxOverride){
  const el = document.getElementById(id);
  if(minOverride !== undefined) el.min = minOverride;
  if(maxOverride !== undefined) el.max = maxOverride;
  el.value = value;
  updateSliderLabel(id);
}

function updateSliderLabel(id){
  const el = document.getElementById(id);
  const out = document.getElementById(id + 'Val');
  if(out) out.textContent = el.value + 'px';
}

const state = {};
function readState(){
  state.topLeft = document.getElementById('topLeft').value;
  state.topRight = document.getElementById('topRight').value;
  state.headline = document.getElementById('headline').value;
  state.subhead = document.getElementById('subhead').value;
  state.bottomLabel = document.getElementById('bottomLabel').value;
  state.bottomHeading = document.getElementById('bottomHeading').value;
  state.bottomDesc = document.getElementById('bottomDesc').value;
  state.headlineFont = document.getElementById('headlineFont').value;
  state.bodyFont = document.getElementById('bodyFont').value;
  state.colorBg = document.getElementById('colorBg').value || '#FAF6EC';
  state.colorHeadline = document.getElementById('colorHeadline').value || '#2B2013';
  state.colorLabel = document.getElementById('colorLabel').value || '#8B6B1F';
  state.colorBottomHead = document.getElementById('colorBottomHead').value || '#2B2013';
  state.colorDesc = document.getElementById('colorDesc').value || '#5C4A32';

  layout.topFontSize = parseInt(document.getElementById('topFontSize').value, 10);
  layout.headlineFontSize = parseInt(document.getElementById('headlineFontSize').value, 10);
  layout.subheadFontSize = parseInt(document.getElementById('subheadFontSize').value, 10);
  layout.bottomLabelFontSize = parseInt(document.getElementById('bottomLabelFontSize').value, 10);
  layout.bottomHeadingFontSize = parseInt(document.getElementById('bottomHeadingFontSize').value, 10);
  layout.descFontSize = parseInt(document.getElementById('descFontSize').value, 10);
  layout.imgTop = parseInt(document.getElementById('imgTop').value, 10);
  layout.imgHeight = parseInt(document.getElementById('imgHeight').value, 10);
}

function wrapText(text, maxWidth, font){
  ctx.font = font;
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for(const word of words){
    const test = line ? line + ' ' + word : word;
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if(line) lines.push(line);
  return lines;
}

function drawMultiline(rawText, x, y, maxWidth, font, lineHeight, align){
  ctx.font = font;
  ctx.textAlign = align || 'left';
  const paragraphs = rawText.split('\n');
  let cy = y;
  for(const p of paragraphs){
    if(p.trim() === ''){ cy += lineHeight; continue; }
    const lines = wrapText(p, maxWidth, font);
    for(const l of lines){
      ctx.fillText(l, x, cy);
      cy += lineHeight;
    }
  }
  return cy;
}

function drawCoverImageAdjusted(img, x, y, w, h, adjust){
  const zoom = Math.max(1, adjust.zoom || 1);
  const panX = Math.max(-1, Math.min(1, adjust.panX || 0));
  const panY = Math.max(-1, Math.min(1, adjust.panY || 0));

  const ir = img.width / img.height;
  const tr = w / h;
  let sw0, sh0, sx0, sy0;
  if(ir > tr){
    sh0 = img.height;
    sw0 = sh0 * tr;
    sx0 = (img.width - sw0) / 2;
    sy0 = 0;
  } else {
    sw0 = img.width;
    sh0 = sw0 / tr;
    sx0 = 0;
    sy0 = (img.height - sh0) / 2;
  }

  const cx = sx0 + sw0/2;
  const cy = sy0 + sh0/2;
  const sw = sw0 / zoom;
  const sh = sh0 / zoom;
  const maxPanX = Math.max(0, (img.width - sw)/2);
  const maxPanY = Math.max(0, (img.height - sh)/2);
  let sx = cx - sw/2 + panX * maxPanX;
  let sy = cy - sh/2 + panY * maxPanY;
  sx = Math.max(0, Math.min(img.width - sw, sx));
  sy = Math.max(0, Math.min(img.height - sh, sy));

  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

function placeholderBox(x, y, w, h, label){
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.lineWidth = 2;
  ctx.setLineDash([10,8]);
  ctx.strokeRect(x+1, y+1, w-2, h-2);
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.textAlign = 'center';
  ctx.font = '500 26px "Libre Franklin", sans-serif';
  ctx.fillText(label, x + w/2, y + h/2);
}

function render(){
  readState();
  const {w, h} = SIZES[currentSize];
  canvas.width = w;
  canvas.height = h;
  document.getElementById('dimsLabel').textContent = w + ' × ' + h;

  ctx.fillStyle = state.colorBg;
  ctx.fillRect(0, 0, w, h);

  const marginX = w * 0.075;

  ctx.fillStyle = state.colorLabel;
  ctx.textBaseline = 'alphabetic';
  const topFont = '600 ' + layout.topFontSize + 'px "' + state.bodyFont + '", sans-serif';
  ctx.font = topFont;
  ctx.textAlign = 'left';
  ctx.fillText(state.topLeft, marginX, h*0.045);
  ctx.textAlign = 'right';
  ctx.fillText(state.topRight, w - marginX, h*0.045);

  let cy = h * 0.10;
  const headlineFontSize = layout.headlineFontSize;
  const headlineFont = (state.headlineFont === 'Anton' ? '400 ' : '700 ') + headlineFontSize + 'px "' + state.headlineFont + '", sans-serif';
  ctx.fillStyle = state.colorHeadline;
  ctx.textAlign = 'left';
  cy = drawMultiline(state.headline, marginX, cy + headlineFontSize*0.85, w - marginX*2, headlineFont, headlineFontSize*1.02, 'left');

  cy += h*0.012;
  const subFontSize = layout.subheadFontSize;
  const subFont = '600 ' + subFontSize + 'px "' + state.bodyFont + '", sans-serif';
  ctx.fillStyle = state.colorLabel;
  drawMultiline(state.subhead, marginX, cy + subFontSize*0.8, w - marginX*2, subFont, subFontSize*1.25, 'left');

  const imgTop = layout.imgTop;
  const imgHeight = layout.imgHeight;
  const imgBottom = imgTop + imgHeight;

  if(currentLayout === 'single'){
    const ix = marginX;
    const iw = w - marginX*2;
    if(images.single){
      drawCoverImageAdjusted(images.single, ix, imgTop, iw, imgHeight, imgAdjust.single);
    } else {
      placeholderBox(ix, imgTop, iw, imgHeight, 'Upload a photo');
    }
  } else {
    const gap = w * 0.015;
    const sideW = w * 0.235;
    const centerW = w - marginX*2 - sideW*2 - gap*2;
    const leftX = marginX;
    const centerX = leftX + sideW + gap;
    const rightX = centerX + centerW + gap;
    if(images.left){ drawCoverImageAdjusted(images.left, leftX, imgTop, sideW, imgHeight, imgAdjust.left); } else { placeholderBox(leftX, imgTop, sideW, imgHeight, 'Left'); }
    if(images.center){ drawCoverImageAdjusted(images.center, centerX, imgTop, centerW, imgHeight, imgAdjust.center); } else { placeholderBox(centerX, imgTop, centerW, imgHeight, 'Center'); }
    if(images.right){ drawCoverImageAdjusted(images.right, rightX, imgTop, sideW, imgHeight, imgAdjust.right); } else { placeholderBox(rightX, imgTop, sideW, imgHeight, 'Right'); }
  }

  let by = imgBottom + h*0.06;
  const labelFontSize = layout.bottomLabelFontSize;
  ctx.font = '700 ' + labelFontSize + 'px "' + state.bodyFont + '", sans-serif';
  ctx.fillStyle = state.colorBottomHead;
  ctx.textAlign = 'left';
  ctx.fillText(state.bottomLabel, marginX, by);

  by += labelFontSize*1.9;
  const bHeadSize = layout.bottomHeadingFontSize;
  ctx.font = '700 ' + bHeadSize + 'px "' + state.headlineFont + '", sans-serif';
  ctx.fillStyle = state.colorBottomHead;
  by = drawMultiline(state.bottomHeading, marginX, by + bHeadSize*0.3, w - marginX*2, ctx.font, bHeadSize*1.15, 'left');

  by += h*0.012;
  const descSize = layout.descFontSize;
  ctx.font = '400 ' + descSize + 'px "' + state.bodyFont + '", sans-serif';
  ctx.fillStyle = state.colorDesc;
  drawMultiline(state.bottomDesc, marginX, by + descSize*0.8, w - marginX*2, ctx.font, descSize*1.45, 'left');
}

function renderSafe(){
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(render);
  } else {
    render();
  }
}

function buildUploadSlots(){
  const container = document.getElementById('uploadSlots');
  container.innerHTML = '';
  const slots = currentLayout === 'single' ? [{key:'single', label:'Main photo'}]
    : [{key:'left', label:'Left photo'}, {key:'center', label:'Center photo'}, {key:'right', label:'Right photo'}];

  for(const slot of slots){
    const wrap = document.createElement('div');
    wrap.className = 'upload-slot';
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    if(images[slot.key]) thumb.style.backgroundImage = 'url(' + images[slot.key].src + ')';
    const info = document.createElement('div');
    info.className = 'info';
    info.innerHTML = '<b>' + slot.label + '</b>' + (images[slot.key] ? 'Photo loaded' : 'No photo yet');
    const btn = document.createElement('button');
    btn.className = 'btn-tiny';
    btn.textContent = images[slot.key] ? 'Replace' : 'Upload';
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          images[slot.key] = img;
          buildUploadSlots();
          buildSlotAdjustments();
          render();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
    btn.addEventListener('click', () => fileInput.click());
    wrap.appendChild(thumb);
    wrap.appendChild(info);
    wrap.appendChild(btn);
    wrap.appendChild(fileInput);
    container.appendChild(wrap);
  }
}

function buildSlotAdjustments(){
  const container = document.getElementById('slotAdjustments');
  container.innerHTML = '';
  const slots = currentLayout === 'single' ? [{key:'single', label:'Main photo'}]
    : [{key:'left', label:'Left photo'}, {key:'center', label:'Center photo'}, {key:'right', label:'Right photo'}];

  for(const slot of slots){
    if(!images[slot.key]) continue;
    const box = document.createElement('div');
    box.className = 'slot-adjust';
    const a = imgAdjust[slot.key];
    box.innerHTML =
      '<div class="slot-title">' + slot.label + ' — crop and position</div>' +
      '<div class="slider-row"><label>Zoom</label><input type="range" min="1" max="2.5" step="0.05" value="' + a.zoom + '" data-key="' + slot.key + '" data-prop="zoom"><span data-out="' + slot.key + '-zoom">' + a.zoom.toFixed(2) + 'x</span></div>' +
      '<div class="slider-row"><label>Move sideways</label><input type="range" min="-100" max="100" step="1" value="' + Math.round(a.panX*100) + '" data-key="' + slot.key + '" data-prop="panX"><span data-out="' + slot.key + '-panX">' + Math.round(a.panX*100) + '</span></div>' +
      '<div class="slider-row"><label>Move up/down</label><input type="range" min="-100" max="100" step="1" value="' + Math.round(a.panY*100) + '" data-key="' + slot.key + '" data-prop="panY"><span data-out="' + slot.key + '-panY">' + Math.round(a.panY*100) + '</span></div>';
    container.appendChild(box);
  }

  container.querySelectorAll('input[type="range"]').forEach(input => {
    input.addEventListener('input', () => {
      const key = input.dataset.key;
      const prop = input.dataset.prop;
      let val = parseFloat(input.value);
      if(prop !== 'zoom') val = val / 100;
      imgAdjust[key][prop] = val;
      const out = container.querySelector('[data-out="' + key + '-' + prop + '"]');
      if(out) out.textContent = prop === 'zoom' ? val.toFixed(2) + 'x' : Math.round(val*100);
      render();
    });
  });
}

document.querySelectorAll('.size-choices button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.size-choices button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSize = btn.dataset.size;
    resetLayoutDefaults();
    render();
  });
});

document.querySelectorAll('.layout-choices button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.layout-choices button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentLayout = btn.dataset.layout;
    buildUploadSlots();
    buildSlotAdjustments();
    render();
  });
});

document.getElementById('resetImgBtn').addEventListener('click', () => {
  const d = defaultLayoutFor(currentSize);
  layout.imgTop = d.imgTop;
  layout.imgHeight = d.imgHeight;
  setSlider('imgTop', layout.imgTop, 0, SIZES[currentSize].h);
  setSlider('imgHeight', layout.imgHeight, 40, SIZES[currentSize].h);
  ['single','left','center','right'].forEach(k => { imgAdjust[k] = {zoom:1, panX:0, panY:0}; });
  buildSlotAdjustments();
  render();
});

['topFontSize','headlineFontSize','subheadFontSize','bottomLabelFontSize','bottomHeadingFontSize','descFontSize','imgTop','imgHeight'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    updateSliderLabel(id);
    render();
  });
});

function linkColorInputs(colorId, textId){
  const colorEl = document.getElementById(colorId);
  const textEl = document.getElementById(textId);
  colorEl.addEventListener('input', () => {
    textEl.value = colorEl.value.toUpperCase();
    render();
  });
  textEl.addEventListener('input', () => {
    let v = textEl.value.trim();
    if(!v.startsWith('#')) v = '#' + v;
    if(/^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{3})$/.test(v)){
      colorEl.value = v;
      render();
    }
  });
}
linkColorInputs('colorBgPicker', 'colorBg');
linkColorInputs('colorHeadlinePicker', 'colorHeadline');
linkColorInputs('colorLabelPicker', 'colorLabel');
linkColorInputs('colorBottomHeadPicker', 'colorBottomHead');
linkColorInputs('colorDescPicker', 'colorDesc');

const textInputs = ['topLeft','topRight','headline','subhead','bottomLabel','bottomHeading','bottomDesc'];
textInputs.forEach(id => {
  document.getElementById(id).addEventListener('input', render);
});
document.getElementById('headlineFont').addEventListener('change', render);
document.getElementById('bodyFont').addEventListener('change', render);

const paletteList = [
  '#2B2013','#5C4A32','#8B6B1F','#C9A227','#FAF6EC',
  '#F0E9D8','#7A2E2E','#4A6B4A','#EEE9DD','#000000'
];
const presetsContainer = document.getElementById('palettePresets');
paletteList.forEach(hex => {
  const sw = document.createElement('button');
  sw.className = 'preset-swatch';
  sw.style.background = hex;
  sw.title = hex;
  sw.addEventListener('click', () => {
    document.getElementById('colorHeadline').value = hex;
    document.getElementById('colorHeadlinePicker').value = hex;
    document.getElementById('colorBottomHead').value = hex;
    document.getElementById('colorBottomHeadPicker').value = hex;
    render();
  });
  presetsContainer.appendChild(sw);
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  render();
  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'story-post-' + currentSize + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 'image/png');
});

resetLayoutDefaults();
buildUploadSlots();
buildSlotAdjustments();
renderSafe();
</script>
